[project]
name = "transcription-pipeline"
version = "1.0.0"
description = "Production-ready audio transcription service powered by OpenAI Whisper"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "openai-whisper>=20231117",
    "pydub>=0.25.1",
    "loguru>=0.7.2",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
